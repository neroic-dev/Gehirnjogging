name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DasBlatt-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Ungezippte APK als Release – immer unter demselben Link:
      # https://github.com/neroic-dev/Gehirnjogging/releases/latest/download/DasBlatt.apk
      - name: Release aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DasBlatt.apk
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste DasBlatt.apk \
            --target "$GITHUB_SHA" \
            --title "Das Blatt – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. APK direkt herunterladen und installieren." \
            --latest
