plugins {
    id 'com.android.application'
}

android {
    namespace 'de.neroic.dasblatt'
    compileSdk 34

    defaultConfig {
        applicationId 'de.neroic.dasblatt'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fester Debug-Schlüssel, damit neue APKs die installierte App einfach aktualisieren
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
